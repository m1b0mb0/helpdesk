x-app: &app
  build: .
  image: helpdesk:local
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-0.3}
    HELPDESK_ALLOWED_ORIGINS: ${HELPDESK_ALLOWED_ORIGINS:-http://web:8000,https://helpdesk.example.com}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
    CELERY_BROKER_VISIBILITY_TIMEOUT: ${CELERY_BROKER_VISIBILITY_TIMEOUT:-300}
    GENERATION_ENABLED: ${GENERATION_ENABLED:-false}
    GENERATION_RECONCILE_INTERVAL: ${GENERATION_RECONCILE_INTERVAL:-5}
    GENERATION_MAX_INFLIGHT: ${GENERATION_MAX_INFLIGHT:-${CELERY_WORKER_CONCURRENCY:-2}}
    GENERATION_MAX_ATTEMPTS: ${GENERATION_MAX_ATTEMPTS:-3}
    GENERATION_MAX_DISPATCHES: ${GENERATION_MAX_DISPATCHES:-10}
    GENERATION_QUEUE_LEASE_SECONDS: ${GENERATION_QUEUE_LEASE_SECONDS:-60}
    GENERATION_LEASE_SECONDS: ${GENERATION_LEASE_SECONDS:-120}
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert response.status == 200 and response.read() == b'OK'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=celery,generation"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    stop_grace_period: 100s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
