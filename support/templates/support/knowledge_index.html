<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>MetricNest knowledge base</title></head>
<body>
  <h1>MetricNest knowledge base</h1>
  <ul>
    {% for article in articles %}
      <li><a href="{% url 'knowledge_article' slug=article.slug %}">{{ article.title }}</a></li>
    {% empty %}
      <li>No articles are available.</li>
    {% endfor %}
  </ul>
</body>
</html>
